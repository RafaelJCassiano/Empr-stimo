<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;
  --primary:#0f766e;--primary-d:#0d5f58;--success:#16a34a;--warn:#d97706;--danger:#dc2626;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15171b;--card:#1f2229;--text:#f1f2f4;--muted:#9aa0aa;--border:#2c2f36;}
}
:root[data-theme="dark"]{--bg:#15171b;--card:#1f2229;--text:#f1f2f4;--muted:#9aa0aa;--border:#2c2f36;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%;}
header{position:sticky;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:10px;z-index:5;}
header h1{font-size:17px;margin:0;flex:1;}
header button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:8px 10px;font-size:14px;}
main{padding:14px 14px 90px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.muted{color:var(--muted);font-size:13px;}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--border);color:var(--text);}
.btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;}
.btn.secondary{background:var(--border);color:var(--text);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.block{width:100%;margin-top:8px;}
.progress{height:7px;background:var(--border);border-radius:6px;overflow:hidden;margin:6px 0;}
.progress>div{height:100%;background:var(--success);}
.parcelas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.p-chip{font-size:11px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);min-width:52px;text-align:center;cursor:pointer;}
.p-chip.pago{background:var(--success);color:#fff;border-color:var(--success);}
.p-chip.parcial{background:var(--warn);color:#fff;border-color:var(--warn);}
.empty{text-align:center;color:var(--muted);padding:40px 10px;}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--primary);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));}
.sheet h2{margin:0 0 12px;font-size:17px;}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.sheet-actions .btn{flex:1;}
.back{background:transparent;border:none;color:#fff;font-size:20px;padding:0 6px;}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;}
.tabbar button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:12px;color:var(--muted);}
.tabbar button.active{color:var(--primary);font-weight:700;}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
.stat:last-child{border-bottom:none;}
.tx{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.tx b.in{color:var(--success);}
.tx b.out{color:var(--danger);}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
#loginScreen .card{width:100%;max-width:360px;}
#loginScreen h1{font-size:20px;margin:0 0 4px;text-align:center;}
#loginScreen p.muted{text-align:center;margin:0 0 16px;}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
.hidden{display:none!important;}
.spin{text-align:center;padding:60px 0;color:var(--muted);}
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div id="loginScreen">
  <div class="card">
    <h1>💰 Controle de Financeiro</h1>
    <p class="muted">Faça login para continuar</p>
    <label>E-mail</label><input id="loginEmail" type="email" autocomplete="username">
    <label>Senha</label><input id="loginSenha" type="password" autocomplete="current-password">
    <button class="btn block" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
<header>
  <button class="back" id="backBtn" style="visibility:hidden">←</button>
  <h1 id="pageTitle">Minhas Carteiras</h1>
  <button id="headerAction" style="display:none">Pagamento</button>
  <button id="logoutBtn">Sair</button>
</header>
<main id="main"><div class="spin">Carregando...</div></main>
<button class="fab" id="fab">+</button>
<div class="tabbar">
  <button id="tabCarteiras" onclick="goTab('wallets')">💼<br>Carteiras</button>
  <button id="tabFinanceiro" onclick="goTab('financeiro')">📊<br>Financeiro</button>
</div>
</div>
<div id="modalRoot"></div>

<script>
// ============ CONFIGURAÇÃO DO SUPABASE ============
// Cole aqui a URL e a chave "anon public" do seu projeto
// (Supabase > Project Settings > API)
const SUPABASE_URL = "https://jjyouclwvoycsyndfxuc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9F3dCdECAw2FoSij0WrXPg_TmkJ4m9o";
// ====================================================
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIPOS={diario:{label:'Diário',dias:1},semanal:{label:'Semanal',dias:7},mensal:{label:'Mensal',dias:30}};
let db={wallets:[],clients:[],caixaInicial:0,transacoes:[]};
let profile=null; // {id,nome,role}
let view='wallets',curWallet=null,curClient=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=v=>'R$ '+(Number(v)||0).toFixed(2).replace('.',',');
const fmtDate=d=>{const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('pt-BR');};
const fmtDateTime=iso=>new Date(iso).toLocaleString('pt-BR');
const isAdmin=()=>profile&&profile.role==='admin';

// ---------- LOGIN ----------
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('loginSenha').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const senha=document.getElementById('loginSenha').value;
  const errEl=document.getElementById('loginErr');
  errEl.textContent='';
  if(!email||!senha){errEl.textContent='Preencha e-mail e senha.';return;}
  const {error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error){errEl.textContent='Login inválido: '+error.message;return;}
  await bootApp();
}
document.getElementById('logoutBtn').onclick=async()=>{
  await sb.auth.signOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
};
async function bootApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return;}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof){document.getElementById('loginErr').textContent='Sua conta não tem perfil configurado. Fale com o administrador.';await sb.auth.signOut();return;}
  profile=prof;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadAll();
  render();
}
(async()=>{ // sessão já existente ao abrir a página
  const {data:{session}}=await sb.auth.getSession();
  if(session)await bootApp();
})();

// ---------- CARREGAR DADOS DO SUPABASE ----------
async function loadAll(){
  const [{data:wallets},{data:clients},{data:parcelas},{data:transacoes},{data:renovacoes},{data:config}]=await Promise.all([
    sb.from('wallets').select('*').order('created_at'),
    sb.from('clients').select('*').order('created_at'),
    sb.from('parcelas').select('*').order('idx'),
    sb.from('transacoes').select('*').order('data',{ascending:false}),
    sb.from('renovacoes').select('*').order('data',{ascending:false}),
    sb.from('config').select('*').eq('id',1).maybeSingle()
  ]);
  db.wallets=(wallets||[]).map(w=>({id:w.id,nome:w.nome,tipo:w.tipo}));
  db.clients=(clients||[]).map(c=>({
    id:c.id,walletId:c.wallet_id,nome:c.nome,cpf:c.cpf,telefone:c.telefone,endereco:c.endereco,obs:c.obs,
    valor:c.valor,taxaJuros:c.taxa_juros,qtd:c.qtd,dataEmprestimo:c.data_emprestimo,
    parcelas:(parcelas||[]).filter(p=>p.client_id===c.id).sort((a,b)=>a.idx-b.idx).map(p=>({id:p.id,idx:p.idx,valorDevido:Number(p.valor_devido),valorPago:Number(p.valor_pago),vencimento:p.vencimento})),
    renovacoes:(renovacoes||[]).filter(r=>r.client_id===c.id).map(r=>({data:r.data,saldoAnterior:Number(r.saldo_anterior),valorNovo:Number(r.valor_novo),juros:Number(r.juros),valorTotal:Number(r.valor_total),qtd:r.qtd}))
  }));
  db.transacoes=(transacoes||[]).map(t=>({id:t.id,tipo:t.tipo,valor:Number(t.valor),descricao:t.descricao,clientId:t.client_id,data:t.data}));
  db.caixaInicial=config?Number(config.caixa_inicial):0;
}

function addPeriodo(dataISO,tipo,n){
  const d=new Date(dataISO+'T00:00:00');
  if(tipo==='mensal'){d.setMonth(d.getMonth()+n);}else{d.setDate(d.getDate()+TIPOS[tipo].dias*n);}
  return d.toISOString().slice(0,10);
}
function gerarParcelas(valorTotal,qtd,dataInicio,tipo){
  const base=Math.floor((valorTotal/qtd)*100)/100;
  const soma=base*(qtd-1);
  const ultima=Math.round((valorTotal-soma)*100)/100;
  const arr=[];
  for(let i=1;i<=qtd;i++)arr.push({idx:i,valorDevido:i===qtd?ultima:base,valorPago:0,vencimento:addPeriodo(dataInicio,tipo,i)});
  return arr;
}
function aplicarValorEmParcelas(parcelas,amount){
  for(const p of parcelas){
    if(amount<=0)break;
    const falta=p.valorDevido-p.valorPago;
    if(falta<=0)continue;
    const aplica=Math.min(falta,amount);
    p.valorPago+=aplica;amount-=aplica;
  }
}
function clientTotals(c){
  const total=c.parcelas.reduce((s,p)=>s+p.valorDevido,0);
  const pago=c.parcelas.reduce((s,p)=>s+p.valorPago,0);
  const pagas=c.parcelas.filter(p=>p.valorPago>=p.valorDevido-0.005).length;
  return{total,pago,saldo:total-pago,pagas,qtd:c.parcelas.length};
}
function caixaAtual(){
  const entradas=db.transacoes.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas=db.transacoes.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  return db.caixaInicial+entradas-saidas;
}
function naRua(){return db.clients.reduce((s,c)=>s+clientTotals(c).saldo,0);}
function goTab(t){view=t;curWallet=null;curClient=null;render();}

// ---------- RENDER ----------
function render(){
  const main=document.getElementById('main');
  const backBtn=document.getElementById('backBtn');
  const headerAction=document.getElementById('headerAction');
  const fab=document.getElementById('fab');
  document.getElementById('tabCarteiras').classList.toggle('active',view==='wallets'||view==='wallet'||view==='client');
  document.getElementById('tabFinanceiro').classList.toggle('active',view==='financeiro');
  fab.style.display=view==='client'?'none':'flex';
  if(view==='wallets'&&!isAdmin())fab.style.display='none';
  if(view==='financeiro'&&!isAdmin())fab.style.display='none';
  backBtn.style.visibility=(view==='wallet'||view==='client')?'visible':'hidden';
  headerAction.style.display='none';
  if(view==='wallets'){
    document.getElementById('pageTitle').textContent='Minhas Carteiras';
    if(!db.wallets.length){main.innerHTML=`<div class="empty">Nenhuma carteira ainda.${isAdmin()?'<br>Toque em + para criar (Diário, Semanal ou Mensal).':'<br>Peça ao administrador para criar uma carteira.'}</div>`;return;}
    main.innerHTML=db.wallets.map(w=>{
      const clients=db.clients.filter(c=>c.walletId===w.id);
      const tot=clients.reduce((acc,c)=>{const t=clientTotals(c);acc.saldo+=t.saldo;acc.emprestado+=c.valor;return acc;},{saldo:0,emprestado:0});
      return `<div class="card" onclick="openWallet('${w.id}')">
        <div class="row"><b>${w.nome}</b><span class="badge">${TIPOS[w.tipo].label}</span></div>
        <div class="muted">${clients.length} cliente(s)</div>
        <div class="row" style="margin-top:8px"><span class="muted">Emprestado: ${fmt(tot.emprestado)}</span><span class="muted">A receber: ${fmt(tot.saldo)}</span></div>
      </div>`;
    }).join('');
  } else if(view==='wallet'){
    const w=db.wallets.find(x=>x.id===curWallet);
    document.getElementById('pageTitle').textContent=w.nome;
    const clients=db.clients.filter(c=>c.walletId===w.id);
    if(!clients.length){main.innerHTML='<div class="empty">Nenhum cliente nesta carteira.<br>Toque em + para adicionar.</div>';return;}
    main.innerHTML=clients.map(c=>{
      const t=clientTotals(c);
      const pct=t.total?Math.round((t.pago/t.total)*100):0;
      const prox=c.parcelas.find(p=>p.valorPago<p.valorDevido-0.005);
      return `<div class="card" onclick="openClient('${c.id}')">
        <div class="row"><b>${c.nome}</b><span class="muted">${t.pagas}/${t.qtd}</span></div>
        <div class="muted">Emprestado: ${fmt(c.valor)}${c.taxaJuros?' • Juros '+c.taxaJuros+'%':''} • Saldo: ${fmt(t.saldo)}</div>
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="muted">${prox?'Próxima: '+fmtDate(prox.vencimento)+' - '+fmt(prox.valorDevido):'✅ Quitado'}</div>
      </div>`;
    }).join('');
  } else if(view==='client'){
    const c=db.clients.find(x=>x.id===curClient);
    const w=db.wallets.find(x=>x.id===c.walletId);
    document.getElementById('pageTitle').textContent=c.nome;
    headerAction.style.display='inline-block';
    headerAction.onclick=()=>openPaymentModal(c.id);
    const t=clientTotals(c);
    main.innerHTML=`<div class="card">
      <div class="muted">CPF: ${c.cpf||'-'}</div>
      <div class="muted">Telefone: ${c.telefone||'-'}</div>
      <div class="muted">Endereço: ${c.endereco||'-'}</div>
      ${c.obs?`<div class="muted">Obs: ${c.obs}</div>`:''}
      <div class="row" style="margin-top:10px"><b>${fmt(c.valor)}</b><span class="muted">${w.nome} • ${TIPOS[w.tipo].label}</span></div>
      <div class="muted">Juros: ${c.taxaJuros||0}% • Total a receber: ${fmt(t.total)}</div>
      <div class="row"><span class="muted">Pago: ${fmt(t.pago)}</span><span class="muted">Saldo: ${fmt(t.saldo)}</span></div>
      <div class="parcelas">${c.parcelas.map(p=>{
        const st=p.valorPago>=p.valorDevido-0.005?'pago':p.valorPago>0?'parcial':'';
        return `<div class="p-chip ${st}" onclick="event.stopPropagation();quickPay('${c.id}',${p.idx})">#${p.idx}<br>${fmtDate(p.vencimento)}<br>${fmt(p.valorDevido)}</div>`;
      }).join('')}</div>
      ${(c.renovacoes&&c.renovacoes.length)?`<div class="muted" style="margin-top:10px"><b>Histórico de renovações</b><br>${c.renovacoes.map(r=>`${fmtDate(r.data)}: saldo ${fmt(r.saldoAnterior)} + novo ${fmt(r.valorNovo)} + juros ${fmt(r.juros)} = ${fmt(r.valorTotal)} em ${r.qtd}x`).join('<br>')}</div>`:''}
      <button class="btn block" onclick="openRenovarModal('${c.id}')">🔄 Renovar empréstimo</button>
      <div class="sheet-actions">
        <button class="btn secondary" onclick="openClientModal('${c.walletId}','${c.id}')">Editar</button>
        ${isAdmin()?`<button class="btn danger" onclick="delClient('${c.id}')">Excluir</button>`:''}
      </div>
    </div>`;
  } else if(view==='financeiro'){
    document.getElementById('pageTitle').textContent='Financeiro';
    const txs=db.transacoes.slice(0,30);
    main.innerHTML=`<div class="card">
      <div class="stat"><span>Caixa inicial</span><b>${fmt(db.caixaInicial)}</b></div>
      <div class="stat"><span>Caixa atual</span><b>${fmt(caixaAtual())}</b></div>
      <div class="stat"><span>Na rua (a receber)</span><b>${fmt(naRua())}</b></div>
      ${isAdmin()?'<button class="btn secondary block" onclick="openCaixaInicialModal()">Ajustar caixa inicial</button>':''}
      ${isAdmin()?'<button class="btn secondary block" onclick="openUsersModal()">Gerenciar usuários</button>':''}
    </div>
    <div class="card">
      <b>Movimentações</b>
      ${txs.length?txs.map(t=>`<div class="tx"><span>${t.descricao}<br><span class="muted">${fmtDateTime(t.data)}</span></span><b class="${t.tipo==='entrada'?'in':'out'}">${t.tipo==='entrada'?'+':'-'}${fmt(t.valor)}</b></div>`).join(''):'<div class="muted">Nenhuma movimentação ainda.</div>'}
    </div>`;
  }
}
function openWallet(id){curWallet=id;view='wallet';render();}
function openClient(id){curClient=id;view='client';render();}
document.getElementById('backBtn').onclick=()=>{
  if(view==='client'){view='wallet';}else if(view==='wallet'){view='wallets';curWallet=null;}
  render();
};
async function delClient(id){
  if(!confirm('Excluir este cliente? Isso apaga as parcelas dele. As movimentações no financeiro são mantidas.'))return;
  await sb.from('clients').delete().eq('id',id);
  await loadAll();view='wallet';render();
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

// ---------- CARTEIRA ----------
function openWalletModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Nova Carteira</h2>
      <label>Nome</label><input id="wNome" placeholder="Ex: Carteira João">
      <label>Tipo de pagamento</label>
      <select id="wTipo"><option value="diario">Diário</option><option value="semanal">Semanal</option><option value="mensal">Mensal</option></select>
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveWallet()">Salvar</button></div>
    </div></div>`;
}
async function saveWallet(){
  const nome=document.getElementById('wNome').value.trim();
  const tipo=document.getElementById('wTipo').value;
  if(!nome)return alert('Digite um nome.');
  await sb.from('wallets').insert({nome,tipo});
  await loadAll();closeModal();render();
}

// ---------- CLIENTE ----------
function openClientModal(walletId,editId){
  const c=editId?db.clients.find(x=>x.id===editId):null;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>${c?'Editar':'Novo'} Cliente</h2>
      <label>Nome</label><input id="cNome" value="${c?c.nome:''}">
      <div class="grid2"><div><label>CPF</label><input id="cCpf" value="${c?c.cpf||'':''}"></div><div><label>Telefone (DDD+numero)</label><input id="cTel" value="${c?c.telefone||'':''}" placeholder="11999998888"></div></div>
      <label>Endereço</label><input id="cEnd" value="${c?c.endereco||'':''}">
      <label>Observação</label><textarea id="cObs" rows="2">${c?c.obs||'':''}</textarea>
      <div class="grid3">
        <div><label>Valor emprestado</label><input id="cValor" type="number" step="0.01" value="${c?c.valor:''}"></div>
        <div><label>Juros (%)</label><input id="cJuros" type="number" step="0.01" value="${c?c.taxaJuros||0:0}"></div>
        <div><label>Qtd. parcelas</label><input id="cQtd" type="number" value="${c?c.qtd:''}"></div>
      </div>
      <label>Data do empréstimo</label><input id="cData" type="date" value="${c?c.dataEmprestimo:new Date().toISOString().slice(0,10)}">
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveClient('${walletId}','${editId||''}')">Salvar</button></div>
    </div></div>`;
}
async function saveClient(walletId,editId){
  const nome=document.getElementById('cNome').value.trim();
  const valor=parseFloat(document.getElementById('cValor').value);
  const taxaJuros=parseFloat(document.getElementById('cJuros').value)||0;
  const qtd=parseInt(document.getElementById('cQtd').value);
  const dataEmprestimo=document.getElementById('cData').value;
  if(!nome||!valor||!qtd||!dataEmprestimo)return alert('Preencha nome, valor, parcelas e data.');
  const wallet=db.wallets.find(w=>w.id===walletId);
  const valorTotal=Math.round((valor+valor*(taxaJuros/100))*100)/100;
  const base={nome,cpf:document.getElementById('cCpf').value.trim(),telefone:document.getElementById('cTel').value.trim(),
    endereco:document.getElementById('cEnd').value.trim(),obs:document.getElementById('cObs').value.trim(),
    valor,taxa_juros:taxaJuros,qtd,data_emprestimo:dataEmprestimo};
  if(editId){
    const c=db.clients.find(x=>x.id===editId);
    const regerar=c.valor!==valor||c.qtd!==qtd||c.dataEmprestimo!==dataEmprestimo||c.taxaJuros!==taxaJuros;
    await sb.from('clients').update(base).eq('id',editId);
    if(regerar){
      const totalPagoAntigo=c.parcelas.reduce((s,p)=>s+p.valorPago,0);
      const novas=gerarParcelas(valorTotal,qtd,dataEmprestimo,wallet.tipo);
      aplicarValorEmParcelas(novas,totalPagoAntigo);
      await sb.from('parcelas').delete().eq('client_id',editId);
      await sb.from('parcelas').insert(novas.map(p=>({client_id:editId,idx:p.idx,valor_devido:p.valorDevido,valor_pago:p.valorPago,vencimento:p.vencimento})));
    }
  }else{
    const {data:novoCliente,error}=await sb.from('clients').insert({...base,wallet_id:walletId}).select().single();
    if(error){alert('Erro ao salvar cliente: '+error.message);return;}
    const parcelas=gerarParcelas(valorTotal,qtd,dataEmprestimo,wallet.tipo);
    await sb.from('parcelas').insert(parcelas.map(p=>({client_id:novoCliente.id,idx:p.idx,valor_devido:p.valorDevido,valor_pago:p.valorPago,vencimento:p.vencimento})));
    await sb.from('transacoes').insert({tipo:'saida',valor,descricao:'Empréstimo - '+nome,origem:'sistema',client_id:novoCliente.id});
  }
  await loadAll();closeModal();view='wallet';render();
}

// ---------- PAGAMENTOS ----------
async function quickPay(clientId,idx){
  const c=db.clients.find(x=>x.id===clientId);
  const p=c.parcelas.find(x=>x.idx===idx);
  const restante=(p.valorDevido-p.valorPago).toFixed(2);
  const v=prompt(`Parcela #${idx} - valor devido ${fmt(p.valorDevido)}\nQuanto foi pago agora?`,restante);
  if(v===null)return;
  const val=parseFloat(v.replace(',','.'));
  if(isNaN(val)||val<=0)return;
  const novoPago=Math.min(p.valorDevido,p.valorPago+val);
  await sb.from('parcelas').update({valor_pago:novoPago}).eq('id',p.id);
  await sb.from('transacoes').insert({tipo:'entrada',valor:val,descricao:'Pagamento parcela #'+idx+' - '+c.nome,origem:'sistema',client_id:c.id});
  await loadAll();render();
  const c2=db.clients.find(x=>x.id===clientId);
  if(confirm('Enviar comprovante no WhatsApp?'))sendWhatsapp(c2);
}
function openPaymentModal(clientId){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Registrar Pagamento</h2>
      <label>Valor pago (aplica nas parcelas mais antigas primeiro)</label>
      <input id="payValor" type="number" step="0.01">
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="applyPayment('${clientId}')">Salvar e enviar</button></div>
    </div></div>`;
}
async function applyPayment(clientId){
  let amount=parseFloat(document.getElementById('payValor').value);
  if(isNaN(amount)||amount<=0)return alert('Informe um valor válido.');
  const c=db.clients.find(x=>x.id===clientId);
  const totalAplicado=amount;
  const parcelasClone=c.parcelas.map(p=>({...p}));
  aplicarValorEmParcelas(parcelasClone,amount);
  const updates=parcelasClone.filter((p,i)=>p.valorPago!==c.parcelas[i].valorPago);
  await Promise.all(updates.map(p=>sb.from('parcelas').update({valor_pago:p.valorPago}).eq('id',p.id)));
  await sb.from('transacoes').insert({tipo:'entrada',valor:totalAplicado,descricao:'Pagamento - '+c.nome,origem:'sistema',client_id:c.id});
  await loadAll();closeModal();render();
  const c2=db.clients.find(x=>x.id===clientId);
  sendWhatsapp(c2);
}

// ---------- FINANCEIRO ----------
function openCaixaInicialModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Caixa Inicial</h2>
      <label>Valor</label><input id="caixaVal" type="number" step="0.01" value="${db.caixaInicial}">
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveCaixaInicial()">Salvar</button></div>
    </div></div>`;
}
async function saveCaixaInicial(){
  const v=parseFloat(document.getElementById('caixaVal').value);
  if(isNaN(v))return alert('Valor inválido.');
  await sb.from('config').update({caixa_inicial:v}).eq('id',1);
  await loadAll();closeModal();render();
}
function openMovimentoModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Nova Movimentação</h2>
      <label>Tipo</label>
      <select id="mTipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
      <label>Valor</label><input id="mValor" type="number" step="0.01">
      <label>Descrição</label><input id="mDesc" placeholder="Ex: Aporte de capital">
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveMovimento()">Salvar</button></div>
    </div></div>`;
}
async function saveMovimento(){
  const tipo=document.getElementById('mTipo').value;
  const valor=parseFloat(document.getElementById('mValor').value);
  const desc=document.getElementById('mDesc').value.trim()||(tipo==='entrada'?'Entrada manual':'Saída manual');
  if(isNaN(valor)||valor<=0)return alert('Informe um valor válido.');
  await sb.from('transacoes').insert({tipo,valor,descricao:desc,origem:'manual'});
  await loadAll();closeModal();render();
}

// ---------- USUÁRIOS (admin) ----------
async function openUsersModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Usuários</h2>
      <div id="usersList" class="muted">Carregando...</div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
        <b>Criar novo usuário</b>
        <label>Nome</label><input id="uNome">
        <label>E-mail</label><input id="uEmail" type="email">
        <label>Senha</label><input id="uSenha" type="password">
        <label>Papel</label>
        <select id="uRole"><option value="user">Usuário</option><option value="admin">Admin</option></select>
        <button class="btn block" onclick="createUser()">Criar</button>
        <div class="err" id="uErr"></div>
      </div>
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Fechar</button></div>
    </div></div>`;
  refreshUsersList();
}
async function refreshUsersList(){
  const {data:users}=await sb.from('profiles').select('*').order('nome');
  const el=document.getElementById('usersList');
  if(!el)return;
  el.innerHTML=(users||[]).map(u=>`<div class="tx"><span>${u.nome||'(sem nome)'}<br><span class="muted">${u.email||''}</span></span>
    <select onchange="updateUserRole('${u.id}',this.value)" style="width:auto">
      <option value="user" ${u.role==='user'?'selected':''}>Usuário</option>
      <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
    </select></div>`).join('')||'<div class="muted">Nenhum usuário.</div>';
}
async function updateUserRole(id,role){
  await sb.from('profiles').update({role}).eq('id',id);
  if(id===profile.id)profile.role=role;
  refreshUsersList();render();
}
async function createUser(){
  const nome=document.getElementById('uNome').value.trim();
  const email=document.getElementById('uEmail').value.trim();
  const password=document.getElementById('uSenha').value;
  const role=document.getElementById('uRole').value;
  const errEl=document.getElementById('uErr');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Preencha e-mail e senha.';return;}
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(`${SUPABASE_URL}/functions/v1/create-user`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({nome,email,password,role})
  });
  const out=await res.json();
  if(!res.ok){errEl.textContent=out.error||'Erro ao criar usuário.';return;}
  document.getElementById('uNome').value='';document.getElementById('uEmail').value='';document.getElementById('uSenha').value='';
  refreshUsersList();
}

// ---------- RENOVAÇÃO ----------
function openRenovarModal(clientId){
  const c=db.clients.find(x=>x.id===clientId);
  const t=clientTotals(c);
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h2>Renovar Empréstimo</h2>
      <div class="muted">Saldo devedor atual (parcelas em aberto): <b>${fmt(t.saldo)}</b></div>
      <label>Valor novo (dinheiro que o cliente vai pegar agora)</label>
      <input id="rValorNovo" type="number" step="0.01" placeholder="Ex: 500">
      <div class="grid2">
        <div><label>Taxa de juros (%)</label><input id="rJuros" type="number" step="0.01" value="${c.taxaJuros||0}"></div>
        <div><label>Nova qtd. de parcelas</label><input id="rQtd" type="number" value="${c.qtd||1}"></div>
      </div>
      <label>Data base (vencimento das novas parcelas)</label><input id="rData" type="date" value="${new Date().toISOString().slice(0,10)}">
      <div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="renovarSalvar('${clientId}')">Renovar</button></div>
    </div></div>`;
}
async function renovarSalvar(clientId){
  const c=db.clients.find(x=>x.id===clientId);
  const w=db.wallets.find(x=>x.id===c.walletId);
  const saldoAtual=clientTotals(c).saldo;
  const valorNovo=parseFloat(document.getElementById('rValorNovo').value)||0;
  const taxa=parseFloat(document.getElementById('rJuros').value)||0;
  const qtd=parseInt(document.getElementById('rQtd').value);
  const dataBase=document.getElementById('rData').value;
  if(!qtd||!dataBase)return alert('Preencha a quantidade de parcelas e a data.');
  const valorBase=Math.round((saldoAtual+valorNovo)*100)/100;
  const valorTotal=Math.round((valorBase*(1+taxa/100))*100)/100;
  const juros=Math.round((valorTotal-valorBase)*100)/100;
  const novasParcelas=gerarParcelas(valorTotal,qtd,dataBase,w.tipo);
  await sb.from('renovacoes').insert({client_id:c.id,data:dataBase,saldo_anterior:saldoAtual,valor_novo:valorNovo,juros,valor_total:valorTotal,qtd});
  await sb.from('parcelas').delete().eq('client_id',c.id);
  await sb.from('parcelas').insert(novasParcelas.map(p=>({client_id:c.id,idx:p.idx,valor_devido:p.valorDevido,valor_pago:p.valorPago,vencimento:p.vencimento})));
  await sb.from('clients').update({valor:valorBase,taxa_juros:taxa,qtd,data_emprestimo:dataBase}).eq('id',c.id);
  if(valorNovo>0)await sb.from('transacoes').insert({tipo:'saida',valor:valorNovo,descricao:'Renovação (dinheiro novo) - '+c.nome,origem:'sistema',client_id:c.id});
  await loadAll();closeModal();render();
  const c2=db.clients.find(x=>x.id===clientId);
  if(confirm('Enviar comprovante da renovação no WhatsApp?'))sendWhatsappRenovacao(c2,{saldoAtual,valorNovo,taxa,juros,valorTotal,qtd});
}
function sendWhatsappRenovacao(c,info){
  const w=db.wallets.find(x=>x.id===c.walletId);
  const parcela=(info.valorTotal/info.qtd).toFixed(2).replace('.',',');
  let msg=`*Renovação de Empréstimo*\nCliente: ${c.nome}\nCarteira: ${w.nome} (${TIPOS[w.tipo].label})\n\n`;
  msg+=`Saldo anterior: ${fmt(info.saldoAtual)}\nValor novo entregue: ${fmt(info.valorNovo)}\nJuros (${info.taxa}%): ${fmt(info.juros)}\n`;
  msg+=`*Novo total: ${fmt(info.valorTotal)}*\nDividido em ${info.qtd}x de aprox. R$ ${parcela}\n\nPrimeira parcela: ${fmtDate(c.parcelas[0].vencimento)}`;
  let digits=(c.telefone||'').replace(/\D/g,'');
  if(digits && digits.length<=11)digits='55'+digits;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`,'_blank');
}
function sendWhatsapp(c){
  const w=db.wallets.find(x=>x.id===c.walletId);
  const t=clientTotals(c);
  const prox=c.parcelas.find(p=>p.valorPago<p.valorDevido-0.005);
  const restantes=c.parcelas.filter(p=>p.valorPago<p.valorDevido-0.005).map(p=>`#${p.idx} (${fmtDate(p.vencimento)}) - ${fmt(p.valorDevido-p.valorPago)}`).join('\n');
  let msg=`*Comprovante de Pagamento*\nCliente: ${c.nome}\nCarteira: ${w.nome} (${TIPOS[w.tipo].label})\n\n`;
  msg+=`Parcelas pagas: ${t.pagas}/${t.qtd}\nTotal pago: ${fmt(t.pago)}\nSaldo devedor: ${fmt(t.saldo)}\n\n`;
  msg+=t.saldo<=0.005?'✅ Empréstimo quitado!':`Parcelas em aberto:\n${restantes}\n\nPróximo vencimento: ${fmtDate(prox.vencimento)}`;
  let digits=(c.telefone||'').replace(/\D/g,'');
  if(digits && digits.length<=11)digits='55'+digits;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`,'_blank');
}
document.getElementById('fab').onclick=()=>{
  if(view==='wallets'&&isAdmin())openWalletModal();
  else if(view==='wallet')openClientModal(curWallet,null);
  else if(view==='financeiro'&&isAdmin())openMovimentoModal();
};
